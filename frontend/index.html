<!DOCTYPE html>
<html lang="tr" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="VakıfBank FaaS Platform — Serverless Functions" />
  <title>VakıfBank as a Function</title>

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="./style.css" />


  <!-- Immediate Theme Initialization Script (Prevents flash and syncs Monaco) -->
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('faas-theme');
        const theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="navbar-brand">
      <div class="brand-icon">VaaF</div>
      <span class="brand-name">VakıfBank as a Function</span>
    </div>
    <div class="navbar-actions">
      <div class="system-status-badge" id="system-health-badge" title="Sistem Durumu Kontrol Ediliyor">
        <span class="status-dot dot-green"></span>
        <span id="system-health-text">All Systems Operational</span>
      </div>
      <button class="theme-toggle-btn" id="theme-toggle-btn" title="Açık/Koyu Tema Geçişi"
        aria-label="Açık/Koyu Tema Geçişi">
        <span class="theme-circle-dot"></span>
      </button>
    </div>
  </header>

  <!-- Main App Layout -->
  <main class="main-container">
    <!-- Top Hero Banner (Always at top of page) -->
    <section class="hero-top-banner">
      <div class="hero-badge-pill">
        <span>&lt; VakıfBank's FaaS Platform &gt;</span>
      </div>

      <h1 class="hero-landing-headline">
        Deploy Functions at the Speed of Thought
      </h1>

      <p class="hero-landing-subtext">
        Paste your code, select a runtime, and go live in minutes.
      </p>

      <!-- Visual Workflow Pipeline -->
      <div class="hero-workflow-pipeline">
        <!-- Step 1 -->
        <div class="workflow-step-card">
          <div class="workflow-step-badge">1</div>
          <span class="workflow-step-title">Kodunu Yaz</span>
        </div>

        <div class="workflow-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </div>

        <!-- Step 2 -->
        <div class="workflow-step-card">
          <div class="workflow-step-badge">2</div>
          <span class="workflow-step-title">Tek Tıkla Dağıt</span>
        </div>

        <div class="workflow-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </div>

        <!-- Step 3 -->
        <div class="workflow-step-card">
          <div class="workflow-step-badge">3</div>
          <span class="workflow-step-title">Otomatik Ölçeklensin</span>
        </div>

        <div class="workflow-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </div>

        <!-- Step 4 -->
        <div class="workflow-step-card">
          <div class="workflow-step-badge">4</div>
          <span class="workflow-step-title">Anında Test Et</span>
        </div>
      </div>
    </section>

    <!-- Top Dashboard Row: Create Function & Functions List side-by-side -->
    <div class="top-dashboard-grid">
      <!-- Create Function Card -->
      <section class="card create-card">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
          İşlev Oluştur
        </h2>

        <form id="create-function-form">
          <div class="create-form-grid">
            <div class="form-group">
              <label for="fn-name-input" class="form-label">Function Name</label>
              <div class="form-input-wrapper">
                <input type="text" id="fn-name-input" class="input" placeholder="my-function" autocomplete="off"
                  required />
              </div>
              <div class="form-error-text" id="fn-name-error"></div>
            </div>

            <div class="form-group">
              <label for="fn-runtime-select" class="form-label">Runtime Version</label>
              <select id="fn-runtime-select" class="select">
                <option value="python">Python 3.11</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="btn-create-function">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2v10m0 0l-4-4m4 4l4-4M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path>
            </svg>
            <span>İşlev Oluştur</span>
          </button>
        </form>
      </section>

      <!-- Functions List Card -->
      <section class="card functions-card">
        <div class="section-header">
          <div class="functions-header-left">
            <h2 class="card-title">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
              </svg>
              Fonksiyonlar
            </h2>
            <span class="badge badge-passive" id="functions-count-badge">0 fonksiyon</span>
          </div>
          <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
              stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="fn-search-input" class="input input-search" placeholder="Fonksiyon ara..."
              autocomplete="off" />
          </div>
        </div>
        <div id="functions-container" class="functions-list-scroll"></div>
      </section>
    </div>

    <!-- Workspace Detail Panel Section -->
    <section class="workspace-section card hidden" id="workspace-section">
      <!-- Dynamically populated by FunctionsManager via template clone -->
    </section>

    <!-- HTML Template for Function Workspace -->
    <template id="workspace-template">
      <div class="workspace-header">
        <div class="workspace-header-left">
          <div class="workspace-title-group">
            <span class="workspace-runtime-icon"></span>
            <h3 class="workspace-title"></h3>
            <span class="workspace-status-badge-slot"></span>
          </div>
          <div class="workspace-url-box">
            <a class="url-text" href="#" target="_blank" rel="noopener noreferrer" title="Yeni sekmede aç"></a>
            <button class="icon-btn copy-url-btn" title="Kopyala">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="workspace-header-right">
          <button class="icon-btn workspace-close-btn" title="Kapat">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="panel-tabs-bar">
        <div class="panel-tabs-left">
          <button class="panel-tab-btn active" data-tab="code">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
            <span>Kod</span>
          </button>
          <button class="panel-tab-btn" data-tab="test">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span>Test</span>
          </button>
          <button class="panel-tab-btn" data-tab="revisions">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 14 14"></polyline>
            </svg>
            <span>Sürümler</span>
          </button>
          <button class="panel-tab-btn" data-tab="monitor">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
            <span>Monitor</span>
          </button>
        </div>
        <button class="btn btn-tab-refresh" id="workspace-tab-refresh-btn" title="Sekmeyi Yenile">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M23 4v6h-6"></path>
            <path d="M1 20v-6h6"></path>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          <span>Yenile</span>
        </button>
      </div>

      <!-- Tab 1: Kod (VS Code Replica IDE Layout) -->
      <div class="panel-tab-content active" data-content-tab="code">
        <div class="vscode-shell" lang="en">
          <!-- Activity Bar -->
          <div class="vsc-activitybar">
            <div class="vsc-activity-group">
              <button class="vsc-activity-item active" data-act="explorer" type="button"
                title="Explorer — Kenar çubuğunu aç/kapat">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M10 3h5l4 4v12a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path>
                  <polyline points="15 3 15 8 19 8"></polyline>
                  <path d="M6 7v12a3 3 0 0 0 3 3h7"></path>
                </svg>
              </button>
              <button class="vsc-activity-item" data-act="search" type="button" title="Search — Editörde ara">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <circle cx="11" cy="11" r="7"></circle>
                  <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
                </svg>
              </button>
              <button class="vsc-activity-item" data-act="scm" type="button" title="Source Control — Sürüm geçmişi">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <circle cx="7" cy="6" r="2.5"></circle>
                  <circle cx="7" cy="18" r="2.5"></circle>
                  <circle cx="17" cy="12" r="2.5"></circle>
                  <line x1="7" y1="8.5" x2="7" y2="15.5"></line>
                  <path d="M9.5 6H13a2 2 0 0 1 2 2v1.5"></path>
                </svg>
              </button>
              <button class="vsc-activity-item" data-act="run" type="button" title="Run and Debug — Test sekmesi">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <polygon points="6 4 6 20 19 12"></polygon>
                </svg>
              </button>
            </div>

            <div class="vsc-activity-group">
              <button class="vsc-activity-item" data-act="settings" type="button" title="Settings — Ortam değişkenleri">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
                  </path>
                </svg>
              </button>
            </div>
          </div>

          <!-- Side Bar -->
          <aside class="vsc-sidebar">
            <div class="vsc-sidebar-title">Explorer</div>

            <div class="vsc-sidebar-body">
              <!-- Files Section -->
              <div class="vsc-section">
                <button class="vsc-section-header" type="button">
                  <svg class="vsc-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                  <span class="vsc-fn-folder-name">FUNCTION</span>
                </button>
                <div class="vsc-section-body">
                  <div class="vsc-tree-row active explorer-file-entry">
                    <span class="vsc-file-icon">
                      <svg viewBox="0 0 24 24" width="16" height="16">
                        <path fill="#387eb8"
                          d="M11.91 2c-5.08 0-4.76 2.2-4.76 2.2l.01 2.28h4.84v.69H5.16S2 6.8 2 11.9c0 5.12 2.76 4.93 2.76 4.93h1.65v-2.32s-.09-2.76 2.71-2.76h4.69s2.58.04 2.58-2.5V4.57S16.8 2 11.91 2zm-2.6 1.48a.93.93 0 1 1 0 1.86.93.93 0 0 1 0-1.86z" />
                        <path fill="#ffe052"
                          d="M12.09 22c5.08 0 4.76-2.2 4.76-2.2l-.01-2.28H12v-.69h6.84S22 17.2 22 12.1c0-5.12-2.76-4.93-2.76-4.93h-1.65v2.32s.09 2.76-2.71 2.76H10.2s-2.58-.04-2.58 2.5v4.68s-.41 2.57 4.48 2.57zm2.6-1.48a.93.93 0 1 1 0-1.86.93.93 0 0 1 0 1.86z" />
                      </svg>
                    </span>
                    <span class="vsc-entry-filename">handler.py</span>
                  </div>
                </div>
              </div>

              <!-- Deploy Section (AWS Lambda Style) -->
              <div class="vsc-section vsc-deploy-section">
                <button class="vsc-section-header" type="button">
                  <svg class="vsc-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                  <span>DEPLOY</span>
                </button>
                <div class="vsc-section-body vsc-deploy-actions">
                  <button class="vsc-btn vsc-btn-deploy btn-deploy" type="button" title="Deploy">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                      stroke-width="2.5">
                      <path d="M12 2v10m0 0l-4-4m4 4l4-4M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path>
                    </svg>
                    <span>Deploy</span>
                  </button>
                  <button class="vsc-btn vsc-btn-run btn-run-code" type="button" title="Run">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
                      <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <span>Run</span>
                  </button>
                </div>
              </div>

              <!-- Environment Variables Section (AWS Lambda Style) -->
              <div class="vsc-section vsc-env-section">
                <button class="vsc-section-header" type="button">
                  <svg class="vsc-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                  <span>ENVIRONMENT VARIABLES</span>
                </button>
                <div class="vsc-section-body">
                  <div class="vsc-env-list env-rows-list"></div>
                  <button class="vsc-btn vsc-btn-secondary btn-add-env" type="button">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                      <line x1="12" y1="5" x2="12" y2="19"></line>
                      <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Değişken Ekle</span>
                  </button>
                </div>
              </div>
            </div>

            <!-- Easter Egg: Official VakıfBank Animated Logo -->
            <div class="vsc-easteregg vsc-bunny" aria-hidden="true">
              <div class="vsc-vb-logo-wrap">
                <!-- Ambient Glow Background -->
                <div class="vsc-vb-glow-aura"></div>

                <!-- Unified Centered Logo SVG: Emblem & Wordmark on the exact same axis -->
                <div class="vsc-vb-svg-box">
                  <svg class="vsc-vb-unified-svg" viewBox="0 -2 120 45" width="130" height="48">
                    <defs>
                      <linearGradient id="vb-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffd54f"/>
                        <stop offset="45%" stop-color="#fbc34e"/>
                        <stop offset="85%" stop-color="#f59e0b"/>
                        <stop offset="100%" stop-color="#d97706"/>
                      </linearGradient>
                      <filter id="vb-depth" x="-10%" y="-10%" width="120%" height="120%">
                        <feDropShadow dx="0" dy="1.2" stdDeviation="0.8" flood-color="#78350f" flood-opacity="0.4"/>
                      </filter>
                    </defs>

                    <!-- Centered Emblem (Mathematically centered at X = 60.000) -->
                    <g id="vb-emblem-group" transform="translate(46.48, 0)">
                      <!-- Emblem Outer Gold Shape -->
                      <path
                        class="vsc-vb-emblem-path"
                        d="M 24.687,8.707 C 24.939,7.271 23.617,5.27 20.018,5.27 H 11.075 C 8.624,5.27 7.087,6.953 6.814,8.648 L 5,18.184 c 1.593,-0.004 12.089,0 12.067,0 h 0.682 c 3.759,-0.021 5.923,-0.865 6.318,-3.593 0.262,-1.836 -1.35,-3.021 -2.667,-3.273 1.332,-0.243 2.951,-0.696 3.287,-2.611 z"
                        fill="url(#vb-gold-grad)"
                        filter="url(#vb-depth)"
                        transform="matrix(1.356331,0,0,1.356331,-6.781655,-6.78214)"/>
                      <!-- Emblem Inner Wing -->
                      <path
                        class="vsc-vb-wing"
                        d="m 16.289,9.266 c -0.912,1.155 -4.227,5.164 -4.897,5.925 -1.497,1.703 -4.584,1.449 -4.605,1.406 0,-0.002 1.113,-5.265 1.474,-6.749 0.989,-4.035 4.401,-3.08 4.401,-3.08 0,0 -0.909,0.131 -1.551,0.95 -0.651,0.83 -1.389,4.874 -1.806,6.764 1.955,-2.285 4.635,-5.233 5.092,-5.785 1.948,-2.358 4.999,-2.033 4.999,-2.033 0,0 -1.188,0.166 -3.107,2.602 z"
                        fill="#ffffff"
                        transform="matrix(1.356331,0,0,1.356331,-6.781655,-6.78214)"/>
                    </g>

                    <!-- Centered Typography (Mathematically centered at X = 60.000) -->
                    <g id="vb-text-group" transform="translate(-30.26, 23)">
                      <path
                        class="vsc-vb-wordmark"

                  title="Sol Paneli Aç/Kapat (Explorer)">
                  <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.2">
                    <rect width="14" height="12" x="1" y="2" rx="1.5"></rect>
                    <path d="M5.5 2v12"></path>
                  </svg>
                </button>
                <!-- 2: Alt barı aç/kapat (Console/Output) -->

                  title="Alt Konsol Panelini Aç/Kapat (Output)">
                  <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.2">
                    <rect width="14" height="12" x="1" y="2" rx="1.5"></rect>
                    <path d="M1 9.5h14"></path>
                  </svg>
                </button>

                  </button>
                  <button class="vsc-icon-btn" data-panel-act="close" type="button" title="Paneli kapat">

      <div class="panel-tab-content hidden" data-content-tab="test">
        <div class="test-layout-wrapper">
          <!-- Request Box -->
          <div class="test-request-box">
            <div class="section-title">Request Body (JSON)</div>
            <div class="monaco-test-editor workspace-test-editor"></div>
            <button class="btn btn-primary mt-3 btn-run-test">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <span>Test Et</span>
            </button>
          </div>

          <!-- Lambda Style Result Card (Hidden until tested) -->
          <div class="lambda-test-card hidden lambda-result-box">
            <div class="lambda-test-header">
              <div class="lambda-header-left">
                <span class="lambda-status-icon">✔</span>
                <span class="lambda-status-title">Yürütme işlevi: başarılı</span>
                <span class="badge lambda-header-badge"></span>
              </div>
              <button class="lambda-toggle-btn open">
                <svg class="lambda-chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                  stroke-width="2">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
                <span>Ayrıntılar</span>
              </button>
            </div>

            <div class="lambda-details-body">
              <div class="lambda-response-section">
                <div class="lambda-response-header">
                  <span class="lambda-section-subtitle">Response</span>
                  <div class="lambda-meta-tags">
                    <span class="badge lambda-status-badge"></span>
                    <span class="lambda-duration-tag">0 ms</span>
                  </div>
                </div>
                <pre class="lambda-response-pre"></pre>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Tab 3: Sürümler -->
      <div class="panel-tab-content hidden" data-content-tab="revisions">
        <div class="revisions-wrapper">
          <div class="tab-loading-state">
            <div class="tab-loading-spinner"></div>
            <span>Sürümler yükleniyor...</span>
          </div>
        </div>
      </div>

      <!-- Tab 4: Monitor (Pod Logları) -->
      <div class="panel-tab-content hidden" data-content-tab="monitor">
        <div class="monitor-layout-wrapper">
          <div class="logs-terminal">
            <div class="text-muted">Loglar yükleniyor...</div>
          </div>
        </div>
      </div>
